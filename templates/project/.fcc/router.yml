version: 1
owner: fcc
purpose: agent-guidance
routes:
  trivial:
    alias: haiku
    model: ${MODEL_HAIKU:-provider/haiku-placeholder}
  balanced:
    alias: sonnet
    model: ${MODEL_SONNET:-provider/sonnet-placeholder}
